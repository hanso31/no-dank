<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" role="img" aria-label="no dank. logo">
  <!-- Saeckchen-Icon mit drei Gestankpunkten -->
  <g transform="translate(20,20)">
    <!-- Gestankpunkte (werden absorbiert) -->
    <circle cx="30" cy="18" r="6" fill="#D8FF3E"/>
    <circle cx="50" cy="8"  r="5" fill="#D8FF3E"/>
    <circle cx="68" cy="20" r="4" fill="#D8FF3E"/>
    <!-- Saeckchen -->
    <path d="M20 45 L75 45 L70 105 Q47 115 25 105 Z" fill="#948B7E"/>
    <path d="M20 45 Q47 55 75 45" stroke="#6B645A" stroke-width="3" fill="none"/>
    <path d="M28 62 L66 62" stroke="#EFEAE0" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- Wortmarke: Inter Bold, "no" Rauch / "dank" Stein / Lime-Punkt -->
  <text x="120" y="95" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="56">
    <tspan fill="#6B645A">no</tspan><tspan fill="#948B7E">dank</tspan>
  </text>
  <circle cx="336" cy="95" r="8" fill="#D8FF3E"/>
</svg>
